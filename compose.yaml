services:
  app:
    build: .
    ports:
      - "127.0.0.1:${HANDMADE_PORT:-8000}:8000"
    environment:
      APP_URL: "http://localhost:${HANDMADE_PORT:-8000}"
      LARAVEL_STORAGE_PATH: /var/lib/handmade/storage
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: handmade
      DB_USERNAME: handmade
      DB_PASSWORD: "${HANDMADE_DB_PASSWORD:-handmade-local}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - handmade-data:/var/lib/handmade

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: handmade
      MYSQL_USER: handmade
      MYSQL_PASSWORD: "${HANDMADE_DB_PASSWORD:-handmade-local}"
      MYSQL_ROOT_PASSWORD: "${HANDMADE_DB_ROOT_PASSWORD:-handmade-root-local}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - handmade-mysql:/var/lib/mysql

volumes:
  handmade-data:
  handmade-mysql:
